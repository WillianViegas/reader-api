<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reader — Leitor de Mangás</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Loading inicial -->
    <div class="boot" id="boot">
      <div class="boot-mark"></div>
    </div>

    <!-- Auth -->
    <section id="view-auth" class="view auth" hidden>
      <div class="auth-card">
        <h1 class="auth-title">Reader</h1>
        <p class="auth-sub">Sua biblioteca de mangás</p>
        <div class="auth-tabs">
          <button class="auth-tab is-active" id="tab-login" type="button">Entrar</button>
          <button class="auth-tab" id="tab-register" type="button">Criar conta</button>
        </div>
        <form id="form-login" class="auth-form">
          <input class="field" type="email" name="email" placeholder="E-mail" autocomplete="email" required />
          <input class="field" type="password" name="password" placeholder="Senha" autocomplete="current-password" required />
          <button class="btn btn-primary" type="submit">Entrar</button>
        </form>
        <form id="form-register" class="auth-form" hidden>
          <input class="field" type="text" name="displayName" placeholder="Nome de exibição" required />
          <input class="field" type="email" name="email" placeholder="E-mail" autocomplete="email" required />
          <input class="field" type="password" name="password" placeholder="Senha (mín. 8 caracteres)" minlength="8" autocomplete="new-password" required />
          <button class="btn btn-primary" type="submit">Criar conta</button>
        </form>
        <p class="auth-error" id="auth-error" role="alert" hidden></p>
      </div>
    </section>

    <!-- App shell -->
    <section id="view-shell" class="view shell" hidden>
      <header class="topbar">
        <div class="topbar-brand">Reader</div>
        <div class="topbar-search">
          <input class="field" id="search-input" type="search" placeholder="Buscar no catálogo…" autocomplete="off" />
        </div>
        <details class="tag-filter" id="tag-filter">
          <summary class="field" id="tag-filter-label">Todas as categorias</summary>
          <div class="tag-filter-panel" id="tag-filter-options" aria-label="Categorias disponíveis">
            <p class="tag-filter-status">Carregando categorias…</p>
          </div>
        </details>
        <nav class="topbar-nav">
          <button class="nav-btn is-active" data-view="catalog" type="button">Catálogo</button>
          <button class="nav-btn" data-view="library" type="button">Biblioteca</button>
          <button class="nav-btn" data-view="continue" type="button">Continuar lendo</button>
          <button class="nav-btn nav-btn-ghost" id="btn-auth" type="button">Entrar</button>
        </nav>
      </header>

      <main class="content">
        <div class="content-status" id="content-status" hidden></div>
        <div class="library-toolbar" id="library-toolbar" hidden>
          <h2 class="library-heading">Minha biblioteca</h2>
          <button class="btn btn-primary" id="pdf-upload-toggle" type="button" aria-expanded="false" aria-controls="pdf-upload-form">+ Importar PDF</button>
        </div>
        <form class="pdf-upload" id="pdf-upload-form" hidden>
          <label class="pdf-dropzone" id="pdf-dropzone">
            <input class="pdf-file-input" type="file" name="file" accept="application/pdf,.pdf" required />
            <span class="pdf-dropzone-icon" aria-hidden="true">PDF</span>
            <span class="pdf-dropzone-text">
              <strong id="pdf-file-name">Escolha ou arraste um arquivo PDF</strong>
              <small>Livros, mangás ou HQs · até 100 MB</small>
            </span>
          </label>
          <label class="pdf-upload-title">Título
            <input class="field" type="text" name="title" maxlength="500" placeholder="Título do livro, mangá ou HQ" required />
          </label>
          <div class="pdf-upload-actions">
            <button class="btn btn-ghost" id="pdf-upload-cancel" type="button">Cancelar</button>
            <button class="btn btn-primary" type="submit">Importar</button>
          </div>
        </form>
        <div class="grid" id="grid"></div>
        <nav class="pagination" id="pagination" aria-label="Paginação do catálogo" hidden>
          <button class="btn pagination-btn" id="page-prev" type="button" aria-label="Página anterior">←</button>
          <span class="pagination-status" id="pagination-status"></span>
          <button class="btn pagination-btn" id="page-next" type="button" aria-label="Próxima página">→</button>
        </nav>
        <div class="empty" id="empty" hidden>
          <p>Nenhum resultado.</p>
        </div>
      </main>
    </section>

    <!-- Detail -->
    <section id="view-detail" class="view detail" hidden>
      <button class="btn-back" id="btn-detail-back" type="button">← Voltar</button>
      <div class="detail-body">
        <div class="detail-cover"><img id="detail-cover" alt="" /></div>
        <div class="detail-info">
          <h2 id="detail-title" class="detail-title"></h2>
          <p id="detail-meta" class="detail-meta"></p>
          <p id="detail-desc" class="detail-desc"></p>
          <div class="detail-actions">
            <button class="btn btn-primary" id="btn-add-library" type="button">Adicionar à biblioteca</button>
            <button class="btn btn-ghost" id="btn-toggle-fav" type="button" hidden>Favoritar</button>
          </div>
          <h3 class="detail-chapters-title">Capítulos</h3>
          <div class="chapter-language-tabs" id="chapter-language-tabs" role="tablist" aria-label="Idiomas disponíveis"></div>
          <ul class="chapter-list" id="chapter-list"></ul>
        </div>
      </div>
    </section>

    <!-- Reader -->
    <section id="view-reader" class="view reader" hidden>
      <div class="reader-stage" id="reader-stage">
        <img id="reader-page" class="reader-page" alt="Página" />
        <div class="reader-ocr-overlay" id="reader-ocr-overlay" hidden aria-label="Trechos reconhecidos"></div>
        <div class="reader-progress" id="reader-progress"><span></span></div>
        <button class="reader-ocr-toggle" id="reader-ocr-toggle" type="button" aria-label="Reconhecer texto da página" aria-pressed="false" title="Reconhecer texto da página">OCR</button>
        <aside class="reader-ocr-panel" id="reader-ocr-panel" hidden aria-live="polite">
          <header class="reader-ocr-panel-header">
            <strong>Texto reconhecido</strong>
            <button class="reader-ocr-close" id="reader-ocr-close" type="button" aria-label="Fechar texto reconhecido">×</button>
          </header>
          <p class="reader-ocr-status" id="reader-ocr-status"></p>
          <button class="reader-ocr-select" id="reader-ocr-select" type="button" aria-pressed="false">Selecionar balão</button>
          <textarea class="reader-ocr-text" id="reader-ocr-text" rows="3" aria-label="Texto OCR editável" placeholder="Toque em um trecho ou selecione uma região."></textarea>
          <div class="reader-ocr-words" id="reader-ocr-words"></div>
          <section class="reader-ocr-translation" aria-label="Traduzir texto OCR">
            <div class="reader-ocr-language-row">
              <label>De
                <select id="reader-ocr-source">
                  <option value="en">Inglês</option>
                  <option value="it">Italiano</option>
                  <option value="pt-BR">Português (Brasil)</option>
                </select>
              </label>
              <button class="reader-ocr-swap" id="reader-ocr-swap" type="button" aria-label="Inverter idiomas" title="Inverter idiomas">↔</button>
              <label>Para
                <select id="reader-ocr-target">
                  <option value="en">Inglês</option>
                  <option value="it">Italiano</option>
                  <option value="pt-BR" selected>Português (Brasil)</option>
                </select>
              </label>
            </div>
            <button class="reader-ocr-translate" id="reader-ocr-translate" type="button">Traduzir</button>
            <p class="reader-ocr-translation-note">O texto será enviado ao MyMemory. Limite anônimo: 5.000 caracteres por dia.</p>
            <p class="reader-ocr-translation-status" id="reader-ocr-translation-status" aria-live="polite"></p>
            <textarea class="reader-ocr-result" id="reader-ocr-result" rows="2" aria-label="Tradução" readonly placeholder="Tradução"></textarea>
            <button class="reader-ocr-save" id="reader-ocr-save" type="button" hidden>Salvar tradução</button>
          </section>
        </aside>
        <div class="reader-ocr-selection-box" id="reader-ocr-selection-box" hidden></div>
        <div class="reader-controls" id="reader-controls">
          <button class="reader-btn" id="reader-back" type="button">← Biblioteca</button>
          <div class="reader-controls-right">
            <span class="reader-counter" id="reader-counter"></span>
            <button class="reader-btn" id="reader-zoom" type="button">Zoom</button>
            <button class="reader-btn" id="reader-complete" type="button">Concluir capítulo</button>
          </div>
        </div>
        <button class="reader-nav reader-nav-prev" id="reader-prev" type="button" aria-label="Anterior">‹</button>
        <button class="reader-nav reader-nav-next" id="reader-next" type="button" aria-label="Próxima">›</button>
      </div>
    </section>
  </div>

  <script type="module" src="./app.js?v=20261020-pdf-reader"></script>
</body>
</html>
